name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # تثبيت وإعداد Gradle تلقائياً
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # بناء التطبيق مباشرة عبر gradle
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # رفع ملف الـ APK الجاهز للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
