name: Android Build 🚀

# متى يتم تشغيل هذا البناء؟ (عند أي Push أو Pull Request لفرع main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (الضرورية لـ Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء الصلاحية لملف gradlew لكي يعمل
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء التطبيق بصيغة Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. حفظ الـ APK النهائي لكي تتمكن من تحميله!
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
