name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # إضافة صلاحيات التشغيل لملف gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # بناء التطبيق
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # رفع ملف الـ APK لتتمكن من تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
