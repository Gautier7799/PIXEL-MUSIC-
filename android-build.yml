name: Android Build 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # بدلاً من البحث عن gradlew، سنقوم بتثبيت وإعداد Gradle مباشرة على السيرفر
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4' # نستخدم إصدار Gradle حديث ومستقر

      # نستخدم أمر gradle مباشرة بدلاً من ./gradlew
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
